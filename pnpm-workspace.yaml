packages:
    - packages/*

# Dependency versions shared across all packages
catalog:
    "@electron/asar": ^4.3.1
    "@ffmpeg/ffmpeg": ^0.12.15
    "@ffmpeg/util": ^0.12.2
    "@intrnl/xxhash64": "^0.1.2"
    "@song-spotlight/api": "^2.2.0"
    "@streamparser/json": "^0.0.22"
    "@tanstack/virtual-core": "3.19.11"
    "@stylistic/eslint-plugin": "^5.10.0"
    "@types/chrome": ^0.3.7
    "@types/fs-extra": "^11.0.4"
    "@types/node": ^26.6.6
    "@types/react": "19.2.3"
    "@types/react-dom": "19.2.3"
    "@types/ws": ^8.18.2
    "@types/yazl": "^3.3.1"
    "@vap/core": "0.0.12"
    "@vap/shiki": "0.10.5"
    "diff": "^9.0.0"
    "esbuild": "^0.28.2"
    "eslint-plugin-simple-header": ^1.2.2
    "eslint-plugin-simple-import-sort": "^14.0.0"
    "fflate": "^0.8.3"
    "fs-extra": "^11.3.6"
    "gifenc": "github:mattdesl/gifenc#64842fca317b112a8590f8fef2bf3825da8f6fe3"
    "gifuct-js": "^2.1.2"
    "html-minifier-terser": "^7.2.0"
    "idb": "8.0.3"
    "jsqr": "1.4.0"
    "lodash": "^4.18.1"
    "md5": "^2.3.0"
    "moment": "2.30.1"
    "nanoid": "^5.1.16"
    "native-file-system-adapter": "^3.0.1"
    "oxfmt": "^0.75.0"
    "oxlint": ^1.93.0
    "oxlint-tsgolint": ^7.0.2006
    "p-limit": "^7.3.3"
    "puppeteer-core": "^25.16.0"
    "standalone-electron-types": "^41.2.1"
    "svgo": "^4.1.0"
    "ts-patch": "^3.3.0"
    "ts-pattern": ^5.9.2
    "tsx": "^4.23.15"
    "type-fest": "^5.10.0"
    "typescript": "^6.0.3"
    "typescript-transform-paths": "^3.5.6"
    "ws": ^8.22.2
    "yaml-js": "^0.3.1"
    "zip-local": "^0.3.5"
    "@vencord/monaco-editor": "0.57.0-beta.4"

strictPeerDependencies: false
peerDependencyRules:
    allowedVersions:
        "@song-spotlight/api@2.2.0>typescript": "^6.0.3"
    ignoreMissing:
        - eslint
allowedDeprecatedVersions:
    q: "*"
    resolve-url: "*"
    source-map-resolve: "*"
    source-map-url: "*"
    urix: "*"

allowBuilds:
    esbuild: true
pmOnFail: warn
verifyDepsBeforeRun: prompt
minimumReleaseAge: 7
minimumReleaseAgeExclude:
    - "@song-spotlight/api"
    - "@vencord/*"
    - "@equicord/*"
